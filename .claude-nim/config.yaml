# Claude Code proxy - generated by build_config.py
#
# Sources: probe_results.json (models that returned a real completion
# against this account's key) and the alias map in build_config.py.
# Regenerate with:  python build_config.py && python config-guard.py
#
# Callable chat models: 10 general, 3 specialist.
#
# Do not hand-edit a fallback list into `[]`: LiteLLM accepts that, and it
# silently disables failover, so one 429 ends the turn. config-guard.py
# rejects that shape, and start-proxy.ps1 restores config.good.yaml if it
# ever appears again.

general_settings:
  # Resolved from the environment at import time, never stored in the file:
  # the config is safe to copy, diff and commit, and rotating the key is a
  # one-line change to .env plus the user environment.
  master_key: os.environ/LITELLM_MASTER_KEY
  allow_requests_on_db_unavailable: true
  disable_spend_logs: true
  disable_reset_budget: true

litellm_settings:
  drop_params: true
  request_timeout: 600
  # Two quick retries, then move to the next model in the chain: Claude
  # Code retries independently, and a model that is throttled stays
  # throttled seconds later.
  num_retries: 2
  retry_after: 2
  allowed_fails: 2
  cooldown_time: 20
  set_verbose: false
  turn_off_message_logging: true
  fallbacks:
    - "claude-fable-5.1": ["nvidia/nemotron-3.5-super-vl-120b-a12b", "stepfun-ai/step-5-preview", "meta/muse-glimmer-30b"]
    - "claude-fable-5": ["nvidia/nemotron-3.5-super-vl-120b-a12b", "stepfun-ai/step-5-preview", "meta/muse-glimmer-30b"]
    - "claude-mythos-5.1": ["nvidia/nemotron-3.5-super-vl-120b-a12b", "stepfun-ai/step-5-preview", "meta/muse-glimmer-30b"]
    - "claude-mythos-5": ["nvidia/nemotron-3.5-super-vl-120b-a12b", "stepfun-ai/step-5-preview", "meta/muse-glimmer-30b"]
    - "claude-opus-5.5": ["nvidia/nemotron-3.5-super-vl-120b-a12b", "stepfun-ai/step-5-preview", "meta/muse-glimmer-30b"]
    - "claude-sonnet-5.5": ["nvidia/nemotron-3-ultra-550b-a55b", "stepfun-ai/step-5-preview", "meta/muse-glimmer-30b"]
    - "claude-haiku-5.5": ["nvidia/nemotron-3-ultra-550b-a55b", "nvidia/nemotron-3.5-super-vl-120b-a12b", "stepfun-ai/step-5-preview"]
    - "nvidia/nemotron-3-ultra-550b-a55b": ["nvidia/nemotron-3.5-super-vl-120b-a12b", "stepfun-ai/step-5-preview", "meta/muse-glimmer-30b", "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"]
    - "nvidia/nemotron-3.5-super-vl-120b-a12b": ["nvidia/nemotron-3-ultra-550b-a55b", "stepfun-ai/step-5-preview", "meta/muse-glimmer-30b", "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"]
    - "stepfun-ai/step-5-preview": ["nvidia/nemotron-3-ultra-550b-a55b", "nvidia/nemotron-3.5-super-vl-120b-a12b", "meta/muse-glimmer-30b", "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"]
    - "meta/muse-glimmer-30b": ["nvidia/nemotron-3-ultra-550b-a55b", "nvidia/nemotron-3.5-super-vl-120b-a12b", "stepfun-ai/step-5-preview", "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"]
    - "openai/gpt-oss-20b": ["nvidia/nemotron-3.5-lightning-30b-a3b", "meta/muse-glimmer-30b", "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"]
    - "z-ai/glm-5.3-flash": ["nvidia/nemotron-3.5-lightning-30b-a3b", "meta/muse-glimmer-30b", "stepfun-ai/step-5-preview"]
    - "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning": ["nvidia/nemotron-3-ultra-550b-a55b", "nvidia/nemotron-3.5-super-vl-120b-a12b", "stepfun-ai/step-5-preview", "meta/muse-glimmer-30b"]
    - "nvidia/nemotron-3.5-lightning-30b-a3b": ["nvidia/nemotron-3-ultra-550b-a55b", "nvidia/nemotron-3.5-super-vl-120b-a12b", "stepfun-ai/step-5-preview", "meta/muse-glimmer-30b"]
    - "poolside/laguna-xs-2.1": ["nvidia/nemotron-3-ultra-550b-a55b", "nvidia/nemotron-3.5-super-vl-120b-a12b", "stepfun-ai/step-5-preview", "meta/muse-glimmer-30b"]
    - "nvidia/ising-calibration-1.5-31b": ["nvidia/nemotron-3-ultra-550b-a55b", "nvidia/nemotron-3.5-super-vl-120b-a12b", "stepfun-ai/step-5-preview", "meta/muse-glimmer-30b"]
    - "meta/llama-3.2-11b-vision-instruct": ["nvidia/nemotron-3-ultra-550b-a55b", "nvidia/nemotron-3.5-super-vl-120b-a12b", "stepfun-ai/step-5-preview", "meta/muse-glimmer-30b"]
    - "google/diffusiongemma-26b-a4b-it": ["nvidia/nemotron-3-ultra-550b-a55b", "nvidia/nemotron-3.5-super-vl-120b-a12b", "stepfun-ai/step-5-preview", "meta/muse-glimmer-30b"]
    - "nvidia/*": ["nvidia/nemotron-3-ultra-550b-a55b", "nvidia/nemotron-3.5-super-vl-120b-a12b", "stepfun-ai/step-5-preview"]

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  retry_after: 2
  allowed_fails: 2
  cooldown_time: 20
  enable_pre_call_checks: false
  retry_policy:
    RateLimitErrorRetries: 2
    InternalServerErrorRetries: 2
    TimeoutErrorRetries: 2
    AuthenticationErrorRetries: 0
    BadRequestErrorRetries: 0

model_list:
  # ---- Claude Code tier aliases ----
  - model_name: claude-fable-5.1
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY
  - model_name: claude-fable-5
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY
  # Claude Code's own name for the top model. Sessions, settings files and the
  # SDK ask for this id; without an entry the request fails model validation.
  - model_name: claude-mythos-5.1
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY
  - model_name: claude-mythos-5
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY
  - model_name: claude-opus-5.5
    litellm_params:
      model: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      api_key: os.environ/NVIDIA_API_KEY
  - model_name: claude-sonnet-5.5
    litellm_params:
